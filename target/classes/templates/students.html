<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
</head>
<body>
    <div th:replace="navbar.html"></div> <!-- Include navigation bar -->
    <h1>Students</h1>
    
    <a href="/students/new" style="margin-bottom: 10px; display: inline-block;">Create New Student</a>

    <table border="1" style="width: 100%; text-align: left;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Total Credits</th>
                <th>Total Hours</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.totalCredits}"></td>
                <td th:text="${student.totalHours}"></td>
                <td>
                    <a th:href="@{/students/{id}(id=${student.id})}">View Details</a> |
                    <a th:href="@{/students/edit/{id}(id=${student.id})}">Edit</a> |
                    <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                       onclick="return confirm('Are you sure you want to delete this student?');">
                       Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
