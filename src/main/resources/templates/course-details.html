<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Course Details</title>
</head>
<body>
<h1 th:text="${course.name}">Course Name</h1>
<p><strong>Credits:</strong> <span th:text="${course.credits}"></span></p>
<p><strong>Duration:</strong> <span th:text="${course.duration}"></span> hours</p>
<h2>Enrolled Students</h2>
<ul>
  <li th:each="student : ${students}">
    <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.name}"></a>
  </li>
</ul>
<a href="/departments">Back to Departments</a>
</body>
</html>
