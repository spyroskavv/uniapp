<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Professor Details</title>
</head>
<body>
<h1 th:text="${professor.name}">Professor Name</h1>
<h2>Courses Taught</h2>
<ul>
  <li th:each="course : ${courses}">
    <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.name}"></a>
  </li>
</ul>
<a href="/departments">Back to Departments</a>
</body>
</html>
