<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Details</title>
</head>
<body>
<h1 th:text="${student.name}">Student Name</h1>
<p><strong>Total Credits:</strong> <span th:text="${totalCredits}"></span></p>
<p><strong>Total Hours:</strong> <span th:text="${totalHours}"></span></p>
<p><strong>Passing Semester:</strong> <span th:text="${passingSemester ? 'Yes' : 'No'}"></span></p>
<h2>Enrolled Courses</h2>
<ul>
    <li th:each="course : ${courses}">
        <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.name}"></a>
    </li>
</ul>
<a href="/departments">Back to Departments</a>
</body>
</html>
